services:

  # ── Infrastructure ────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-upload_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend Services ──────────────────────────────────

  upload-service:
    image: ${IMAGE_PREFIX:-ammmiii/anti-fraud}-upload-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend/upload-service
    environment:
      SERVER_PORT: ":8081"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-upload_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-pipeline.exchange}
      RABBITMQ_UPLOAD_EVENTS_QUEUE: ${RABBITMQ_UPLOAD_EVENTS_QUEUE:-upload.pipeline-events.queue}
      RABBITMQ_UPLOAD_DLQ: ${RABBITMQ_UPLOAD_DLQ:-upload.pipeline-events.dlq}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: datasets
      MINIO_SECURE: "false"
      UPLOAD_MAX_FILE_SIZE_BYTES: ${UPLOAD_MAX_FILE_SIZE_BYTES:-52428800}
      UPLOAD_MAX_ROWS: ${UPLOAD_MAX_ROWS:-250000}
      UPLOAD_MAX_VALIDATION_ERRORS: ${UPLOAD_MAX_VALIDATION_ERRORS:-100}
      ADMIN_STATUS_PATCH_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  relations-service:
    image: ${IMAGE_PREFIX:-ammmiii/anti-fraud}-relations-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend/relations-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: ":8082"
      RELATIONS_DATASET_ID: demo
      RELATIONS_DATASET_PATH: /data/clean_refund_dataset.csv
      RELATIONS_DEMO_FALLBACK_ENABLED: "false"
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-pipeline.exchange}
    volumes:
      - ./data:/data:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  scoring-service:
    image: ${IMAGE_PREFIX:-ammmiii/anti-fraud}-scoring-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend/scoring-service
    environment:
      SERVER_PORT: "8083"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
      SCORING_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-upload_db}
      SCORING_DB_USER: ${POSTGRES_USER:-postgres}
      SCORING_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RELATIONS_BASE_URL: ${RELATIONS_BASE_URL:-http://relations-service:8082}
      SCORING_DEMO_ENABLED: ${SCORING_DEMO_ENABLED:-false}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      relations-service:
        condition: service_started
    restart: unless-stopped

  # ── Gateway ───────────────────────────────────────────

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./backend/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - upload-service
      - relations-service
      - scoring-service
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────

  frontend:
    image: ${IMAGE_PREFIX:-ammmiii/anti-fraud}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
