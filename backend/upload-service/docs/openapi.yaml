openapi: 3.0.1
info:
  title: Upload Service API
  version: "1.0.0"
  description: API for dataset upload, preview and analysis control
servers:
  - url: http://localhost:8081
paths:
  /api/datasets/health:
    get:
      summary: Health check
      responses:
        '200':
          description: service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string

  /api/datasets/upload:
    post:
      summary: Upload CSV dataset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: upload accepted
          content:
            application/json:
              examples:
                cleanUpload:
                  value:
                    datasetId: 8f79f612-770b-48fd-9d25-79d88d1e4211
                    jobId: c8f7844b-f2fb-42a1-b45f-397d56f3ad2f
                    filename: clean_refund_dataset.csv
                    status: UPLOADED
              schema:
                type: object
                properties:
                  datasetId:
                    type: string
                  jobId:
                    type: string
                  filename:
                    type: string
                  status:
                    type: string
        '400':
          description: invalid upload or CSV validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/datasets/{datasetId}/preview:
    get:
      summary: Preview uploaded dataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: preview
          content:
            application/json:
              examples:
                cleanPreview:
                  value:
                    headers:
                      - order_id
                      - customer_id
                      - return_id
                    rows:
                      - order_id: order_1001
                        customer_id: customer_200
                        return_id: return_3001
                    rawRows:
                      - ["order_1001", "customer_200", "return_3001"]
                    rowCount: 1
                    truncated: false
                dirtyBusinessPreview:
                  value:
                    headers:
                      - purchase_id
                      - buyer_id
                      - refund_request_id
                    rows:
                      - purchase_id: purchase_1001
                        buyer_id: buyer_200
                        refund_request_id: refund_req_3001
                    rawRows:
                      - ["purchase_1001", "buyer_200", "refund_req_3001"]
                    rowCount: 1
                    truncated: false
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '404':
          description: dataset was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analysis/{datasetId}/start:
    post:
      summary: Start analysis for dataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: job created
          content:
            application/json:
              examples:
                startAnalysis:
                  value:
                    jobId: c8f7844b-f2fb-42a1-b45f-397d56f3ad2f
                    status: NORMALIZING
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
                    enum: [UPLOADED, NORMALIZING, NORMALIZED, BUILDING_RELATIONS, SCORING, COMPLETED, FAILED]
        '404':
          description: dataset was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: analysis could not be started because pipeline event publishing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analysis/{jobId}/status:
    get:
      summary: Get analysis job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: job status
          content:
            application/json:
              examples:
                normalizing:
                  value:
                    id: c8f7844b-f2fb-42a1-b45f-397d56f3ad2f
                    jobId: c8f7844b-f2fb-42a1-b45f-397d56f3ad2f
                    datasetId: 8f79f612-770b-48fd-9d25-79d88d1e4211
                    status: NORMALIZING
                    currentStep: NORMALIZING
                    message: Normalizing CSV columns and refund records.
                    progressPercent: 20
                    stages:
                      - status: UPLOADED
                        message: Dataset uploaded and ready to start analysis.
                        state: completed
                      - status: NORMALIZING
                        message: Normalizing CSV columns and refund records.
                        state: current
                    createdAt: "2026-06-01T10:00:00Z"
                    updatedAt: "2026-06-01T10:01:00Z"
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
        '404':
          description: analysis job was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update analysis job status for local demo/admin use
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            examples:
              scoring:
                value:
                  status: SCORING
              failed:
                value:
                  status: FAILED
                  errorMessage: Failed to calculate refund risk scores
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [UPLOADED, NORMALIZING, NORMALIZED, BUILDING_RELATIONS, SCORING, COMPLETED, FAILED]
                errorMessage:
                  type: string
      responses:
        '200':
          description: updated job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
        '400':
          description: unsupported status or invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: analysis job was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PreviewResponse:
      type: object
      properties:
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        rawRows:
          type: array
          description: Positional row values retained for compatibility and debugging.
          items:
            type: array
            items:
              type: string
        rowCount:
          type: integer
        truncated:
          type: boolean
    AnalysisStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        datasetId:
          type: string
          format: uuid
        status:
          type: string
          enum: [UPLOADED, NORMALIZING, NORMALIZED, BUILDING_RELATIONS, SCORING, COMPLETED, FAILED]
        currentStep:
          type: string
        message:
          type: string
        progressPercent:
          type: integer
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StatusStage'
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StatusStage:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        state:
          type: string
          enum: [pending, current, completed, failed]
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        code:
          type: string
          example: INVALID_CSV
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
