upstream upload-service {
    server upload-service:8081;
}

upstream relations-service {
    server relations-service:8082;
}

upstream scoring-service {
    server scoring-service:8083;
}

server {
    listen 8080;
    server_name localhost;

    client_max_body_size 50m;

    location /api/analysis {
        proxy_pass http://upload-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/datasets/ {
        proxy_pass http://upload-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/relations/ {
        proxy_pass http://relations-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/scoring {
        proxy_pass http://scoring-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint for monitoring and CI/CD
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
